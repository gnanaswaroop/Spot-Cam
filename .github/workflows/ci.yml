name: CI

# Runs on every pull request, and is reused by the deploy workflow so a failing test blocks a release.
on:
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:unit

  # Each browser's tests are split over five runners, so the slowest browser finishes in about a fifth of the time.
  e2e-shard:
    name: E2E shard (${{ matrix.project }} ${{ matrix.shard }}/5)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [chromium-android, firefox, webkit-iphone]
        shard: [1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install browser
        run: npx playwright install --with-deps ${{ matrix.project == 'chromium-android' && 'chromium' || matrix.project == 'firefox' && 'firefox' || 'webkit' }}
      - run: npx playwright test --project=${{ matrix.project }} --shard=${{ matrix.shard }}/5
      - name: Upload traces from failed tests
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces-${{ matrix.project }}-${{ matrix.shard }}
          path: test-results/
          retention-days: 7

  # One result per browser under the original names, because the branch protection rules require these exact check names.
  e2e:
    name: End-to-end (${{ matrix.project }})
    needs: e2e-shard
    if: ${{ always() }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        project: [chromium-android, firefox, webkit-iphone]
    steps:
      - name: All shards passed
        run: |
          if [ "${{ needs.e2e-shard.result }}" != "success" ]; then
            echo "A shard of the end-to-end tests failed or was cancelled. Open the shard jobs above for the details."
            exit 1
          fi
